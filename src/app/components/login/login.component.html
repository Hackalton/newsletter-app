
<div class="content">
    <div class="login-form">
        <h2 id="header">Login</h2>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-filler">
            <div class="input-div">
                <label for="username">Username</label>
                <input type="text" id="username" formControlName="username" name="username" required/>
            </div>
            <div class="input-div">
                <label for="password">Password</label>
                <input type="text" id="password" formControlName="password" name="password" required/>
            </div>
            <div class="input-div">
                <label for="role">Role</label>
                <select name="role" id="role" formControlName="role">
                    <option value="student">Student</option>
                    <option value="journalist">Journalist</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <button id="submit-btn" type="submit">Login</button>
        </form>
        <h5>
            Don't have an account??? <a routerLink="/signup">Sign Up</a>
        </h5>
    </div>
</div>
