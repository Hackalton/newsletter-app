<div class="parentContainer">
    <div class="header">
        <nav class="nav-bar">
            <div class="nav-item">Name</div>
            <div class="nav-item">id</div>
            <div class="nav-item">status</div>
        </nav>
    </div>
    <div class="content">
            <h2>TITLES</h2>
            <ul *ngFor="let item of allNewsletters">
                <li>
                    <span  class="title" (click)="openModal(item)">{{item.title}}</span>
                <div class="modal" [ngClass]="{'show': isModalVisible}" (click)="closeModal()">
                    <div class="modal-content" (click)="$event.stopPropagation()">
                    <span class="close" (click)="closeModal()">&times;</span>
                    <h2>{{ modalData?.title }}</h2>
                    <p>{{ modalData?.content }}</p>
                    </div>
                </div>
                </li>
    
            </ul>
    </div>
</div>
